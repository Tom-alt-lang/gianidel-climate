<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gianidel Climate Monitor — Charts</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  body { font-family: 'Courier New', Courier, monospace; background: #fff; color: #111; padding: 20px; max-width: 860px; margin: 0 auto; }
  h1 { font-family: 'Times New Roman', Times, serif; font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 4px; }
  p.sub { text-align: center; font-size: 12px; margin-bottom: 32px; }
  .chart-wrap { margin-bottom: 40px; }
  .chart-title { font-size: 13px; font-weight: bold; margin-bottom: 6px; }
  canvas { width: 100% !important; }
</style>
</head>
<body>

<h1>Indian Ocean Dipole Mode Indices</h1>
<p class="sub">OISSTv2.1, 1971&ndash;2000 Climatology &nbsp;&middot;&nbsp; Dekadal means</p>

<div class="chart-wrap">
  <p class="chart-title">SETIO [90&ndash;110E, 10S&ndash;0]</p>
  <canvas id="chartSETIO" height="140"></canvas>
</div>

<div class="chart-wrap">
  <p class="chart-title">WTIO [50&ndash;70E, 10S&ndash;10N]</p>
  <canvas id="chartWTIO" height="140"></canvas>
</div>

<div class="chart-wrap">
  <p class="chart-title">DMI = WTIO &minus; SETIO</p>
  <canvas id="chartDMI" height="140"></canvas>
</div>

<p><a href="iod.html">&larr; Back</a></p>
<br>
<p style="font-size:0.8em;font-family:'Times New Roman',Times,serif;">Copyright &copy; 2026 <b>Gianidel Ltd.</b> Internal document.</p>

<script>
fetch('https://raw.githubusercontent.com/Tom-alt-lang/gianidel-climate/main/gianidel_iod_data.json')
  .then(r => r.json())
  .then(d => {
    const dek = d.dekadal || [];

    const labels = dek.map(r => r.dekad);
    const wtio   = dek.map(r => isNaN(Number(r.wtio))  ? 0 : Number(r.wtio));
    const setio  = dek.map(r => isNaN(Number(r.setio)) ? 0 : Number(r.setio));
    const dmi    = dek.map(r => isNaN(Number(r.dmi))   ? 0 : Number(r.dmi));

    function barColors(values) {
      return values.map(v => v >= 0 ? '#b00000' : '#00008b');
    }

    const gridColor   = '#cccccc';
    const tickFont    = { family: 'Courier New', size: 11 };
    const zeroLine    = { color: '#111', width: 1 };

    function makeChart(id, values, yMin, yMax) {
      const ctx = document.getElementById(id).getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: barColors(values),
            borderWidth: 0,
            barPercentage: 0.85,
            categoryPercentage: 0.9
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => (ctx.parsed.y > 0 ? '+' : '') + ctx.parsed.y.toFixed(2) + ' °C'
              }
            }
          },
          scales: {
            x: {
              grid: { color: gridColor },
              ticks: {
                font: tickFont,
                maxRotation: 45,
                minRotation: 45,
                callback: function(val, idx) {
                  // Show label only for D1 of each month
                  const label = labels[idx];
                  return label && label.endsWith('D1') ? label.replace('-D1','') : '';
                }
              },
              border: { color: '#111' }
            },
            y: {
              min: yMin,
              max: yMax,
              grid: { color: gridColor },
              ticks: { font: tickFont },
              border: { color: '#111' },
              title: {
                display: true,
                text: 'Degree C',
                font: tickFont,
                color: '#111'
              }
            }
          },
          animation: false
        },
        plugins: [{
          id: 'zeroline',
          afterDraw(chart) {
            const { ctx, scales: { x, y } } = chart;
            const yZero = y.getPixelForValue(0);
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x.left, yZero);
            ctx.lineTo(x.right, yZero);
            ctx.strokeStyle = zeroLine.color;
            ctx.lineWidth   = zeroLine.width;
            ctx.stroke();
            ctx.restore();
          }
        }]
      });
    }

    makeChart('chartSETIO', setio, -1.5, 2);
    makeChart('chartWTIO',  wtio,  -1.5, 2);
    makeChart('chartDMI',   dmi,   -1.5, 2.5);
  })
  .catch(e => document.body.innerHTML += '<p>Error: ' + e.message + '</p>');
</script>

</body>
</html>
