<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gianidel Climate Monitor — Charts</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  body { font-family: 'Times New Roman', Times, serif; background: #fff; color: #111; padding: 20px; max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 4px; }
  p.sub { text-align: center; font-size: 12px; margin-bottom: 32px; font-family: 'Times New Roman', Times, serif; }
  .chart-wrap { margin-bottom: 48px; }
  .chart-title { font-size: 13px; font-weight: bold; margin-bottom: 6px; font-family: 'Times New Roman', Times, serif; }
  canvas { width: 100% !important; }
  hr { border: none; border-top: 1px solid #111; margin: 12px 0 24px; }
</style>
</head>
<body>

<h1>Indian Ocean Dipole Mode Indices</h1>
<p class="sub">OISSTv2.1 &nbsp;&middot;&nbsp; 1971&ndash;2000 climatology &nbsp;&middot;&nbsp; Dekadal means</p>

<div class="chart-wrap">
  <p class="chart-title">SETIO &nbsp;[90&ndash;110&deg;E, 10&deg;S&ndash;0&deg;]</p>
  <canvas id="chartSETIO" height="120"></canvas>
</div>

<div class="chart-wrap">
  <p class="chart-title">WTIO &nbsp;[50&ndash;70&deg;E, 10&deg;S&ndash;10&deg;N]</p>
  <canvas id="chartWTIO" height="120"></canvas>
</div>

<div class="chart-wrap">
  <p class="chart-title">DMI &nbsp;= WTIO &minus; SETIO</p>
  <canvas id="chartDMI" height="120"></canvas>
</div>

<hr>
<p><a href="iod.html">&larr; Back</a></p>
<br>
<p style="font-size:0.8em;">Copyright &copy; 2026 <b>Gianidel Ltd.</b> Internal document.</p>

<script>
fetch('https://raw.githubusercontent.com/Tom-alt-lang/gianidel-climate/main/gianidel_iod_data.json')
  .then(r => r.json())
  .then(d => {
    const dek    = (d.dekadal || []).slice(3); // trim first 3 to get ~8 months
    const labels = dek.map(r => r.dekad);

    function toNum(v) { return isNaN(Number(v)) ? 0 : Number(v); }

    const wtio  = dek.map(r => toNum(r.wtio));
    const setio = dek.map(r => toNum(r.setio));
    const dmi   = dek.map(r => toNum(r.dmi));

    const TNR = { family: 'Arial', size: 11 };

    // X-axis tick: show month name only on D1
    function xLabel(label) {
      return label && label.endsWith('-D1') ? label.replace('-D1', '') : '';
    }

    // Grid only on month boundaries (D1)
    function gridColor(ctx) {
      const label = labels[ctx.index];
      return label && label.endsWith('-D1') ? '#cccccc' : 'transparent';
    }

    // Shaded fill datasets — positive (red) and negative (blue)
    function makeShadeDatasets(values) {
      const posData = values.map(v => v > 0 ? v : 0);
      const negData = values.map(v => v < 0 ? v : 0);
      return [
        {
          data: posData,
          fill: 'origin',
          backgroundColor: 'rgba(176, 0, 0, 0.25)',
          borderColor:     'rgba(176, 0, 0, 0.8)',
          borderWidth:     1.5,
          pointRadius:     0,
          tension:         0.3
        },
        {
          data: negData,
          fill: 'origin',
          backgroundColor: 'rgba(0, 0, 139, 0.25)',
          borderColor:     'rgba(0, 0, 139, 0.8)',
          borderWidth:     1.5,
          pointRadius:     0,
          tension:         0.3
        }
      ];
    }

    function makeChart(id, values, yMin, yMax) {
      new Chart(document.getElementById(id).getContext('2d'), {
        type: 'line',
        data: {
          labels:   labels,
          datasets: makeShadeDatasets(values)
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => (ctx.parsed.y > 0 ? '+' : '') + ctx.parsed.y.toFixed(2) + ' °C'
              }
            }
          },
          scales: {
            x: {
              grid:  { color: ctx => gridColor(ctx) },
              ticks: {
                font:        TNR,
                maxRotation: 0,
                minRotation: 0,
                autoSkip:    false,
                callback:    (val, idx) => xLabel(labels[idx])
              },
              border: { color: '#111' }
            },
            y: {
              min:  yMin,
              max:  yMax,
              grid: { color: '#dddddd' },
              ticks: { font: TNR },
              border: { color: '#111' },
              title: {
                display: true,
                text:    'Anomaly (°C)',
                font:    TNR,
                color:   '#111'
              }
            }
          },
          animation: false
        },
        plugins: [{
          id: 'zeroline',
          afterDraw(chart) {
            const { ctx, scales: { x, y } } = chart;
            const yZero = y.getPixelForValue(0);
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x.left,  yZero);
            ctx.lineTo(x.right, yZero);
            ctx.strokeStyle = '#111';
            ctx.lineWidth   = 1;
            ctx.stroke();
            ctx.restore();
          }
        }]
      });
    }

    makeChart('chartSETIO', setio, -1.5,  2.0);
    makeChart('chartWTIO',  wtio,  -1.5,  2.0);
    makeChart('chartDMI',   dmi,   -1.5,  1.5);
  })
  .catch(e => document.body.innerHTML += '<p>Error: ' + e.message + '</p>');
</script>

</body>
</html>
